# Context Architecture XML Lint CI

name: XML Tag Compliance Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'skills/mas-orchestrator/agents/**'
      - 'skills/mas-orchestrator/references/**'
      - 'skills/mas-orchestrator/SKILL.md'
      - 'skills/mas-orchestrator/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/mas-orchestrator/agents/**'
      - 'skills/mas-orchestrator/references/**'
      - 'skills/mas-orchestrator/SKILL.md'

jobs:
  xml-tag-lint:
    name: XML Tag Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run xml_parser unit tests
        working-directory: skills/mas-orchestrator
        run: |
          python -m unittest discover -s scripts -p "test_xml_parser.py" -v
          python scripts/xml_parser.py

      - name: Run XML lint (PR - strict)
        if: github.event_name == 'pull_request'
        working-directory: skills/mas-orchestrator
        run: python scripts/run_xml_lint.py --strict

      - name: Run XML lint (push - informational)
        if: github.event_name == 'push'
        working-directory: skills/mas-orchestrator
        run: python scripts/run_xml_lint.py
        continue-on-error: true

      - name: Generate JSON report
        if: always()
        working-directory: skills/mas-orchestrator
        run: python scripts/run_xml_lint.py --json > xml-lint-report.json
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-lint-report
          path: skills/mas-orchestrator/xml-lint-report.json
          retention-days: 30

  state-manager-tests:
    name: state_manager and c_implementations tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # All test_*.py suites (state_manager, c_implementations, agent_interaction,
      # multi_mas_federation, xml_parser, skillopt_adapter). Failures turn CI red.
      - name: Run all unit test suites
        working-directory: skills/mas-orchestrator
        run: python -m unittest discover -s scripts -p "test_*.py" -v
